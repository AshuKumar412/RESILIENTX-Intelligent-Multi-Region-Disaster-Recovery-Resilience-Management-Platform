server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity-service-route
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: organization-service-route
          uri: lb://ORGANIZATION-SERVICE
          predicates:
            - Path=/api/organizations/**, /api/environments/**, /api/applications/**

        - id: region-service-route
          uri: lb://REGION-SERVICE
          predicates:
            - Path=/api/regions/**

        - id: policy-service-route
          uri: lb://RESILIENCE-POLICY-SERVICE
          predicates:
            - Path=/api/policies/**, /api/recovery-plans/**

        - id: monitoring-service-route
          uri: lb://MONITORING-SERVICE
          predicates:
            - Path=/api/monitoring/**

        - id: recovery-service-route
          uri: lb://RECOVERY-SERVICE
          predicates:
            - Path=/api/incidents/**, /api/recoveries/**

        - id: data-service-route
          uri: lb://DATA-CONTINUITY-SERVICE
          predicates:
            - Path=/api/data/**, /api/ledger/**

        - id: audit-service-route
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit/**

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
