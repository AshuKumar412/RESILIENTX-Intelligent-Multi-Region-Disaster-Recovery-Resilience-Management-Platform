version: '3.8'

services:
  # EXACTLY ONE CENTRAL POSTGRESQL DATABASE
  postgres:
    image: postgres:16-alpine
    container_name: resilientx-db
    environment:
      POSTGRES_DB: resilientx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - ./database/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/migrations/V2__indexes_and_constraints.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./database/migrations/V3__audit_hash_chain.sql:/docker-entrypoint-initdb.d/03_audit.sql
      - ./database/migrations/V4__auth_email_otp_and_security.sql:/docker-entrypoint-initdb.d/04_auth.sql
      - ./database/migrations/V5__remove_operational_defaults.sql:/docker-entrypoint-initdb.d/05_remove_operational_defaults.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resilientx"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resilientx-net

  # REACT FRONTEND SRE CONSOLE
  frontend:
    image: node:20-alpine
    container_name: resilientx-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - postgres
    networks:
      - resilientx-net

volumes:
  postgres_data:

networks:
  resilientx-net:
    driver: bridge
